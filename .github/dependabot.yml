version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "@types/node"
        update-types:
          - minor
          - patch
    # Ungrouped compiler/type and major updates remain visible individually.
    open-pull-requests-limit: 10
