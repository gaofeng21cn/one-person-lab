name: Publish one OPL Package
run-name: Package ${{ inputs.package_id }} ${{ inputs.expected_package_version }} / ${{ inputs.publication_request_id }}

on:
  workflow_call:
    inputs:
      package_id:
        description: Canonical Package id
        required: true
        type: string
      expected_package_version:
        description: Exact stable SemVer selected by canonical Framework main
        required: true
        type: string
      expected_owner_source_commit:
        description: Exact owner commit selected by canonical Framework main
        required: true
        type: string
      expected_framework_source_commit:
        description: Exact Framework main commit that owns the Package projection
        required: true
        type: string
      expected_latest_stable_predecessor:
        description: Exact latest-stable digest observed before dispatch, or none only when the tag is verified absent
        required: true
        type: string
      publication_request_id:
        description: Unique publication correlation id
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package_id:
        description: Canonical Package id
        required: true
        type: string
      expected_package_version:
        description: Exact stable SemVer selected by canonical Framework main
        required: true
        type: string
      expected_owner_source_commit:
        description: Exact owner commit selected by canonical Framework main
        required: true
        type: string
      expected_framework_source_commit:
        description: Exact Framework main commit that owns the Package projection
        required: true
        type: string
      expected_latest_stable_predecessor:
        description: Exact latest-stable digest observed before dispatch, or none only when the tag is verified absent
        required: true
        type: string
      publication_request_id:
        description: Unique publication correlation id
        required: true
        type: string

permissions: {}

concurrency:
  group: opl-package-publication-${{ inputs.package_id }}
  cancel-in-progress: false

jobs:
  publish-package:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'schedule' && 'release-stable-automated' || 'release-stable' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      PACKAGE_ID: ${{ inputs.package_id }}
      EXPECTED_PACKAGE_VERSION: ${{ inputs.expected_package_version }}
      EXPECTED_OWNER_SOURCE_COMMIT: ${{ inputs.expected_owner_source_commit }}
      EXPECTED_FRAMEWORK_SOURCE_COMMIT: ${{ inputs.expected_framework_source_commit }}
      EXPECTED_LATEST_STABLE_PREDECESSOR: ${{ inputs.expected_latest_stable_predecessor }}
      PUBLICATION_REQUEST_ID: ${{ inputs.publication_request_id }}
      PACKAGES_OWNER: ${{ github.repository_owner }}
      PUBLICATION_ENVIRONMENT: ${{ github.event_name == 'schedule' && 'release-stable-automated' || 'release-stable' }}
    steps:
      - name: Checkout exact Framework source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_framework_source_commit }}
          fetch-depth: 1

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Resolve exact Package owner source
        id: package-source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_ID" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]] || { echo "::error::Invalid Package id"; exit 2; }
          manifest="contracts/opl-framework/packages/${PACKAGE_ID}.json"
          source_repo="$(jq -er .source_repo "$manifest")"
          if [[ "$source_repo" =~ ^https://github\.com/([^/]+)/([^/]+)\.git$ ]]; then
            owner_repo="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
          else
            echo "::error::Package source_repo must be a canonical GitHub HTTPS repository: $source_repo"
            exit 2
          fi
          echo "owner_repo=$owner_repo" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Package owner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.package-source.outputs.owner_repo }}
          ref: refs/tags/v${{ inputs.expected_package_version }}
          path: .owner-source
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare exact Package layers
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            [ "$PUBLICATION_ENVIRONMENT" = release-stable-automated ]
          else
            [ "$PUBLICATION_ENVIRONMENT" = release-stable ]
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
          fi
          [[ "$EXPECTED_FRAMEWORK_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_OWNER_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_LATEST_STABLE_PREDECESSOR" == none || "$EXPECTED_LATEST_STABLE_PREDECESSOR" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PUBLICATION_REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$ ]]
          [ "$(git rev-parse HEAD)" = "$EXPECTED_FRAMEWORK_SOURCE_COMMIT" ]
          npm ci --ignore-scripts --no-audit --no-fund

          manifest="contracts/opl-framework/packages/${PACKAGE_ID}.json"
          source_repo="$(jq -er .source_repo "$manifest")"
          if [[ "$source_repo" =~ ^https://github\.com/([^/]+)/([^/]+)\.git$ ]]; then
            repo_name="${BASH_REMATCH[2]}"
          else
            echo "::error::Package source_repo must be a canonical GitHub HTTPS repository: $source_repo"
            exit 2
          fi
          payload_ref="$(jq -er '.codex_surface.plugin_payload_manifest_url // .plugin_payload_manifest_url' "$manifest")"
          payload="contracts/opl-framework/packages/${payload_ref}"
          [ "$(jq -r .package_id "$manifest")" = "$PACKAGE_ID" ]
          [ "$(jq -r .version "$manifest")" = "$EXPECTED_PACKAGE_VERSION" ]
          [ "$(jq -r '.codex_surface.carrier_source_commit // .source_commit' "$manifest")" = "$EXPECTED_OWNER_SOURCE_COMMIT" ]
          [ "$(jq -r .package_id "$payload")" = "$PACKAGE_ID" ]
          [ "$(jq -r .package_version "$payload")" = "$EXPECTED_PACKAGE_VERSION" ]
          [ "$(jq -r .source_commit "$payload")" = "$EXPECTED_OWNER_SOURCE_COMMIT" ]

          [ "$(git -C .owner-source rev-parse HEAD)" = "$EXPECTED_OWNER_SOURCE_COMMIT" ]
          [ "$(git -C .owner-source cat-file -t "refs/tags/v${EXPECTED_PACKAGE_VERSION}")" = tag ]
          [ "$(git -C .owner-source rev-parse "v${EXPECTED_PACKAGE_VERSION}^{}")" = "$EXPECTED_OWNER_SOURCE_COMMIT" ]
          node --experimental-strip-types scripts/package-source-projection-gate.mjs \
            --package-id "$PACKAGE_ID" \
            --owner-root .owner-source

          package_root="dist/package"
          mkdir -p "$package_root"
          archive="$package_root/${PACKAGE_ID}-${EXPECTED_PACKAGE_VERSION}.tar.gz"
          git -C .owner-source archive --format=tar.gz --prefix="${repo_name}/" \
            -o "$GITHUB_WORKSPACE/$archive" "$EXPECTED_OWNER_SOURCE_COMMIT"
          cp "$manifest" "$package_root/package-manifest.json"
          image="ghcr.io/${PACKAGES_OWNER}/one-person-lab-packages/${PACKAGE_ID}"
          archive_sha256="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
          node --experimental-strip-types scripts/materialize-package-payload.mjs \
            --input "$payload" \
            --output "$package_root/payload-manifest.json" \
            --package-manifest "$manifest" \
            --archive "$archive" \
            --artifact-ref "${image}:${EXPECTED_PACKAGE_VERSION}" \
            --archive-sha256 "$archive_sha256" \
            --archive-root "$repo_name" \
            --package-id "$PACKAGE_ID" \
            --package-version "$EXPECTED_PACKAGE_VERSION" \
            --source-commit "$EXPECTED_OWNER_SOURCE_COMMIT"

          {
            echo "PACKAGE_ROOT=$package_root"
            echo "PACKAGE_ARCHIVE=$archive"
            echo "PACKAGE_IMAGE=$image"
            echo "IMMUTABLE_REF=${image}:${EXPECTED_PACKAGE_VERSION}"
            echo "LATEST_STABLE_REF=${image}:latest-stable"
            echo "OCI_SOURCE_URL=${source_repo%.git}"
          } >> "$GITHUB_ENV"

      - name: Authenticate protected Package publisher
        shell: bash
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable Package and advance its channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ensure_public_package() {
            local package_name="$1"
            local encoded readback attempt
            encoded="$(jq -rn --arg value "$package_name" '$value|@uri')"
            for attempt in {1..24}; do
              if readback="$(gh api "/users/${PACKAGES_OWNER}/packages/container/${encoded}" 2>/dev/null)" \
                && jq -e --arg repo "$GITHUB_REPOSITORY" \
                  '.visibility == "public" and .repository.full_name == $repo' <<<"$readback" >/dev/null; then
                return 0
              fi
              gh api --method PATCH "/user/packages/container/${encoded}/visibility" \
                -f visibility=public >/dev/null 2>&1 || true
              if [ "$attempt" -eq 24 ]; then
                echo "::error::GHCR package is not public or is not associated with ${GITHUB_REPOSITORY}: ${package_name}"
                return 1
              fi
              sleep 5
            done
          }

          preflight_args=(
            --artifact-type application/vnd.onepersonlab.package.v1
            --source-url "$OCI_SOURCE_URL"
            --allow-package-manifest-projection-drift
            --layer "${PACKAGE_ARCHIVE}=application/vnd.onepersonlab.package.source.v1+gzip"
            --layer "${PACKAGE_ROOT}/package-manifest.json=application/vnd.onepersonlab.package.manifest.v1+json"
            --layer "${PACKAGE_ROOT}/payload-manifest.json=application/vnd.onepersonlab.package.payload.v1+json"
          )

          published_manifest_digest=""
          immutable_preflight="$(node scripts/oci-publication-preflight.mjs --ref "$IMMUTABLE_REF" "${preflight_args[@]}")"
          immutable_action="$(jq -r .action <<<"$immutable_preflight")"
          if [ "$immutable_action" = reuse ]; then
            digest="$(jq -er .digest <<<"$immutable_preflight")"
            if [ "$(jq -r '.package_manifest_projection_equivalent // false' <<<"$immutable_preflight")" = true ]; then
              immutable_result="reused_registry_projection_equivalent"
              published_manifest_digest="$(jq -er '.layers[] | select(.mediaType == "application/vnd.onepersonlab.package.manifest.v1+json") | .digest' <<<"$immutable_preflight")"
            else
              immutable_result="reused_identical"
            fi
          else
            set +e
            push_result="$(oras push --format json "$IMMUTABLE_REF" \
              --artifact-type application/vnd.onepersonlab.package.v1 \
              --annotation "org.opencontainers.image.source=${OCI_SOURCE_URL}" \
              "${PACKAGE_ARCHIVE}:application/vnd.onepersonlab.package.source.v1+gzip" \
              "${PACKAGE_ROOT}/package-manifest.json:application/vnd.onepersonlab.package.manifest.v1+json" \
              "${PACKAGE_ROOT}/payload-manifest.json:application/vnd.onepersonlab.package.payload.v1+json" 2>&1)"
            push_status=$?
            set -e
            if [ "$push_status" -eq 0 ]; then
              digest="$(jq -er .digest <<<"$push_result")"
              immutable_result="published"
            else
              immutable_reconcile="$(node scripts/oci-publication-preflight.mjs --ref "$IMMUTABLE_REF" "${preflight_args[@]}")"
              [ "$(jq -r .action <<<"$immutable_reconcile")" = reuse ]
              digest="$(jq -er .digest <<<"$immutable_reconcile")"
              if [ "$(jq -r '.package_manifest_projection_equivalent // false' <<<"$immutable_reconcile")" = true ]; then
                immutable_result="reconciled_registry_projection_equivalent_after_unknown"
                published_manifest_digest="$(jq -er '.layers[] | select(.mediaType == "application/vnd.onepersonlab.package.manifest.v1+json") | .digest' <<<"$immutable_reconcile")"
              else
                immutable_result="reconciled_after_unknown"
              fi
            fi
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          ensure_public_package "one-person-lab-packages/${PACKAGE_ID}"

          node scripts/oci-publication-preflight.mjs --ref "$IMMUTABLE_REF" "${preflight_args[@]}" \
            --verify-only --expected-digest "$digest" --anonymous
          node scripts/oci-publication-preflight.mjs --ref "${PACKAGE_IMAGE}@${digest}" "${preflight_args[@]}" \
            --verify-only --expected-digest "$digest" --anonymous

          read_stable_digest() {
            local output status normalized
            set +e
            output="$(oras manifest fetch --descriptor "$LATEST_STABLE_REF" 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              jq -er .digest <<<"$output"
              return
            fi
            normalized="$(tr '[:upper:]' '[:lower:]' <<<"$output")"
            if grep -Eq 'manifest unknown|name unknown|not found|404' <<<"$normalized"; then
              printf '%s\n' none
              return
            fi
            printf '%s\n' "$output" >&2
            return "$status"
          }

          first_stable_digest="$(read_stable_digest)"
          if [ "$first_stable_digest" = "$digest" ]; then
            stable_result="already_current"
          else
            [ "$first_stable_digest" = "$EXPECTED_LATEST_STABLE_PREDECESSOR" ]
            second_stable_digest="$(read_stable_digest)"
            [ "$second_stable_digest" = "$EXPECTED_LATEST_STABLE_PREDECESSOR" ]
            set +e
            oras tag "${PACKAGE_IMAGE}@${digest}" latest-stable
            tag_status=$?
            set -e
            stable_result="advanced"
            if [ "$tag_status" -ne 0 ]; then
              node scripts/oci-publication-preflight.mjs --ref "$LATEST_STABLE_REF" "${preflight_args[@]}" \
                --verify-only --expected-digest "$digest" --anonymous
              stable_result="reconciled_after_unknown"
            fi
          fi
          node scripts/oci-publication-preflight.mjs --ref "$LATEST_STABLE_REF" "${preflight_args[@]}" \
            --verify-only --expected-digest "$digest" --anonymous

          archive_digest="sha256:$(sha256sum "$PACKAGE_ARCHIVE" | cut -d' ' -f1)"
          manifest_digest="${published_manifest_digest:-sha256:$(sha256sum "$PACKAGE_ROOT/package-manifest.json" | cut -d' ' -f1)}"
          payload_digest="sha256:$(sha256sum "$PACKAGE_ROOT/payload-manifest.json" | cut -d' ' -f1)"
          subject="${PACKAGE_IMAGE}@${digest}"
          certificate_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/publish-package.yml@${GITHUB_REF}"
          provenance="$PACKAGE_ROOT/package-provenance.json"
          sbom="$PACKAGE_ROOT/package.spdx.json"
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg package_id "$PACKAGE_ID" \
            --arg version "$EXPECTED_PACKAGE_VERSION" \
            --arg owner_commit "$EXPECTED_OWNER_SOURCE_COMMIT" \
            --arg framework_commit "$EXPECTED_FRAMEWORK_SOURCE_COMMIT" \
            --arg request_id "$PUBLICATION_REQUEST_ID" \
            --arg source_url "$OCI_SOURCE_URL" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg invocation_id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{buildDefinition:{buildType:"https://onepersonlab.ai/buildtypes/opl-package-publication/v1",
              externalParameters:{package_id:$package_id,package_version:$version,
                owner_source_commit:$owner_commit,framework_source_commit:$framework_commit},
              internalParameters:{publication_request_id:$request_id},
              resolvedDependencies:[
                {uri:$source_url,digest:{gitCommit:$owner_commit}},
                {uri:("https://github.com/"+$repository),digest:{gitCommit:$framework_commit}}]},
              runDetails:{builder:{id:$workflow_ref},metadata:{invocationId:$invocation_id}}}' \
            > "$provenance"
          jq -n \
            --arg package_id "$PACKAGE_ID" \
            --arg version "$EXPECTED_PACKAGE_VERSION" \
            --arg subject "$subject" \
            --arg archive_digest "${archive_digest#sha256:}" \
            --arg namespace "https://onepersonlab.ai/spdx/${PACKAGE_ID}/${EXPECTED_PACKAGE_VERSION}/${digest#sha256:}" \
            --arg created_at "$created_at" \
            '{spdxVersion:"SPDX-2.3",dataLicense:"CC0-1.0",SPDXID:"SPDXRef-DOCUMENT",
              name:($package_id+"-"+$version),documentNamespace:$namespace,
              creationInfo:{created:$created_at,creators:["Tool: one-person-lab publish-package.yml"]},
              packages:[{name:$package_id,SPDXID:"SPDXRef-Package",versionInfo:$version,
                downloadLocation:$subject,filesAnalyzed:false,
                checksums:[{algorithm:"SHA256",checksumValue:$archive_digest}]}]}' \
            > "$sbom"
          echo "$GH_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" -eq 3 ]; then return 1; fi
              sleep "$((attempt * 10))"
            done
          }
          retry cosign attest --yes --timeout 60s --oidc-provider github-actions \
            --type slsaprovenance1 --predicate "$provenance" "$subject"
          retry cosign attest --yes --timeout 60s --oidc-provider github-actions \
            --type spdxjson --predicate "$sbom" "$subject"
          retry cosign verify-attestation --timeout 60s \
            --type slsaprovenance1 \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$subject" >/dev/null
          retry cosign verify-attestation --timeout 60s \
            --type spdxjson \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$subject" >/dev/null
          content_lock="$(jq -r '.content_lock.digest // empty' "$PACKAGE_ROOT/payload-manifest.json")"
          if [ -z "$content_lock" ]; then
            content_lock="$(jq -r '.content_lock.digest // empty' "$PACKAGE_ROOT/package-manifest.json")"
          fi
          jq -n \
            --arg package_id "$PACKAGE_ID" \
            --arg version "$EXPECTED_PACKAGE_VERSION" \
            --arg owner_commit "$EXPECTED_OWNER_SOURCE_COMMIT" \
            --arg framework_commit "$EXPECTED_FRAMEWORK_SOURCE_COMMIT" \
            --arg request_id "$PUBLICATION_REQUEST_ID" \
            --arg immutable_ref "$IMMUTABLE_REF" \
            --arg latest_ref "$LATEST_STABLE_REF" \
            --arg predecessor "$EXPECTED_LATEST_STABLE_PREDECESSOR" \
            --arg digest "$digest" \
            --arg archive_digest "$archive_digest" \
            --arg manifest_digest "$manifest_digest" \
            --arg payload_digest "$payload_digest" \
            --arg content_lock "$content_lock" \
            --arg immutable_result "$immutable_result" \
            --arg stable_result "$stable_result" \
            --arg subject "$subject" \
            --arg certificate_identity "$certificate_identity" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg publication_environment "$PUBLICATION_ENVIRONMENT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{surface_kind:"opl_package_publication_receipt.v1",status:"published_and_verified",
              publication_request_id:$request_id,package:{package_id:$package_id,version:$version,
              owner_source_commit:$owner_commit,framework_source_commit:$framework_commit},
              content:{source_archive_digest:$archive_digest,manifest_digest:$manifest_digest,
              payload_manifest_digest:$payload_digest,content_lock:($content_lock | if length > 0 then . else null end)},
              immutable:{ref:$immutable_ref,digest:$digest,result:$immutable_result},
              latest_stable:{ref:$latest_ref,predecessor_digest:$predecessor,digest:$digest,result:$stable_result},
              attestations:{status:"verified",subject:$subject,
                certificate_identity:$certificate_identity,types:["slsaprovenance1","spdxjson"]},
              anonymous_readback:{status:"verified",refs:[$immutable_ref,($immutable_ref|split(":")[0:-1]|join(":"))+"@"+$digest,$latest_ref]},
              mutation_boundary:{registry_atomic_cas_claim:false,
              controls:["protected_environment","single_package_concurrency","double_predecessor_inspect","anonymous_readback"]},
              workflow:{repository:$repository,run_id:$run_id,run_attempt:$run_attempt,environment:$publication_environment}}' \
            > "$PACKAGE_ROOT/publication-receipt.json"
          (cd "$PACKAGE_ROOT" && sha256sum publication-receipt.json > publication-receipt.sha256)

      - name: Upload Package publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-package-publication-${{ inputs.package_id }}-${{ inputs.expected_package_version }}-${{ inputs.publication_request_id }}
          path: |
            dist/package/publication-receipt.json
            dist/package/publication-receipt.sha256
            dist/package/package-provenance.json
            dist/package/package.spdx.json
          if-no-files-found: error
          retention-days: 30
