name: OPL Whitepaper

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the approved build to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-family:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout OPL Framework and family publication owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: one-person-lab
          fetch-depth: 0

      - name: Checkout App whitepaper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: main
          path: one-person-lab-app

      - name: Checkout Cloud whitepaper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-cloud
          ref: main
          path: one-person-lab-cloud

      - name: Checkout MAS whitepaper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/med-autoscience
          ref: main
          path: med-autoscience

      - name: Install document render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-chinese fonts-noto-cjk poppler-utils

      - name: Build the complete branded whitepaper set
        working-directory: one-person-lab
        run: npm run docs:whitepapers:family

      - name: Stage one immutable family artifact
        run: |
          node --experimental-strip-types one-person-lab/scripts/stage-family-whitepaper-artifact.ts \
            --manifest one-person-lab/tmp/pdfs/opl-family-whitepaper-build.json \
            --output artifact

      - name: Upload branded whitepaper candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-family-whitepapers-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 30

  publish-family:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build-family
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: whitepaper-production
    concurrency:
      group: whitepaper-family-publish-gaofeng21cn-one-person-lab
      cancel-in-progress: false
    steps:
      - name: Checkout current branded site with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Checkout the publication toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: toolchain

      - name: Download the exact family artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opl-family-whitepapers-${{ github.sha }}
          path: artifact

      - name: Publish the complete branded collection atomically
        run: |
          mkdir -p site/latest/whitepapers
          rsync -a --delete artifact/whitepapers/ site/latest/whitepapers/
          touch site/.nojekyll
          git -C site config user.name github-actions[bot]
          git -C site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C site add .nojekyll latest/whitepapers
          if git -C site diff --cached --quiet; then
            echo "No publication byte changes."
          else
            git -C site commit -m "docs: publish OPL family whitepapers from ${{ github.sha }}"
            git -C site push origin gh-pages
          fi

      - name: Read back all five public documents
        run: |
          node --experimental-strip-types toolchain/scripts/verify-family-whitepaper-publication.ts \
            --artifact-dir artifact/whitepapers \
            --output family-publication-receipt.json \
            --attempts 6 \
            --interval-ms 10000

      - name: Upload family publication receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-family-whitepaper-publication-receipt-${{ github.sha }}
          path: |
            family-publication-receipt.json
            whitepaper-publication-receipts
          if-no-files-found: error
          retention-days: 90
