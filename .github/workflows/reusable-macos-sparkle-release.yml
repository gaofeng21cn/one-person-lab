name: Reusable macOS Sparkle Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag (for example v0.2.53)
        required: true
        type: string
      app_name:
        description: macOS app bundle filename (for example OPL Fleet Agent.app)
        required: true
        type: string
      dmg_name:
        description: Output DMG filename inside dist/ (for example OPL-Fleet-Agent.dmg)
        required: true
        type: string
      volume_name:
        description: Volume name used when creating the DMG
        required: true
        type: string
      bundle_id:
        description: Expected CFBundleIdentifier
        required: true
        type: string
      display_name:
        description: Expected CFBundleDisplayName
        required: false
        default: ""
        type: string
      expected_team_id:
        description: Expected Apple Developer Team ID
        required: true
        type: string
      signing_identity:
        description: Developer ID Application signing identity
        required: true
        type: string
      expected_feed_url:
        description: Expected Sparkle SUFeedURL in Info.plist
        required: true
        type: string
      verify_binaries:
        description: Comma-separated bundle-relative Mach-O paths to verify as universal binaries
        required: true
        type: string
      build_app_command:
        description: Shell command that builds and signs the universal app bundle
        required: true
        type: string
      preflight_command:
        description: Optional lint and test command executed before configuring signing credentials
        required: false
        default: ""
        type: string
      app_output_path:
        description: Optional path to the built app bundle (defaults to dist/<app_name>)
        required: false
        default: ""
        type: string
      artifact_name:
        description: Uploaded artifact name containing DMG, checksum, and appcast.xml
        required: false
        default: release-macos
        type: string
      environment_name:
        description: Caller repository environment containing signing and Sparkle secrets
        required: false
        default: release
        type: string
      runs_on:
        description: macOS runner label
        required: false
        default: macos-latest
        type: string
      toolchain_ref:
        description: Git ref in gaofeng21cn/one-person-lab providing shared release scripts
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 60
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout OPL macOS Sparkle release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.toolchain_ref }}
          path: .opl-macos-sparkle-toolchain
          sparse-checkout: scripts/macos-sparkle-release
          persist-credentials: false

      - name: Toolchain
        shell: bash
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --show-sdk-version

      - name: Run caller preflight checks
        if: inputs.preflight_command != ''
        env:
          PREFLIGHT_COMMAND: ${{ inputs.preflight_command }}
          OPL_MACOS_SPARKLE_SCRIPTS_DIR: ${{ github.workspace }}/.opl-macos-sparkle-toolchain/scripts/macos-sparkle-release
        shell: bash
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$PREFLIGHT_COMMAND"

      - name: Configure protected Apple and Sparkle credentials
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD || secrets.P12_PASSWORD }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID || secrets.APPLE_ID }}
          APPLE_NOTARY_PASS: ${{ secrets.APPLE_NOTARY_PASSWORD || secrets.APPLE_ID_PASSWORD }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ inputs.expected_team_id }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_P12_BASE64:?Missing Developer ID P12 secret}"
          : "${APPLE_P12_PASSWORD:?Missing Developer ID P12 password secret}"
          : "${APPLE_NOTARY_ID:?Missing notarization Apple ID secret}"
          : "${APPLE_NOTARY_PASS:?Missing notarization app-specific password secret}"
          : "${SPARKLE_ED25519_PRIVATE_KEY:?Missing SPARKLE_ED25519_PRIVATE_KEY secret}"

          keychain="$RUNNER_TEMP/opl-macos-release.keychain-db"
          notary_profile="opl-macos-release"
          keychain_password="$(openssl rand -hex 24)"
          p12_path="$RUNNER_TEMP/DeveloperIDApplication.p12"
          printf '%s' "$APPLE_P12_BASE64" | base64 --decode >"$p12_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12_path" -k "$keychain" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$APPLE_NOTARY_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASS" \
            --keychain "$keychain"

          security find-identity -v -p codesigning "$keychain" | grep -F "$SIGNING_IDENTITY"
          {
            echo "OPL_MACOS_NOTARY_KEYCHAIN=$keychain"
            echo "OPL_MACOS_NOTARY_PROFILE=$notary_profile"
          } >>"$GITHUB_ENV"

      - name: Build signed universal app
        env:
          BUILD_APP_COMMAND: ${{ inputs.build_app_command }}
          OPL_SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          OPL_EXPECTED_TEAM_ID: ${{ inputs.expected_team_id }}
          OPL_FLEET_AGENT_SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          OPL_FLEET_AGENT_EXPECTED_TEAM_ID: ${{ inputs.expected_team_id }}
          OPL_FLEET_AGENT_REQUIRE_DEVELOPER_ID: "1"
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          TEAM_ID: ${{ inputs.expected_team_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          OPL_MACOS_SPARKLE_SCRIPTS_DIR: ${{ github.workspace }}/.opl-macos-sparkle-toolchain/scripts/macos-sparkle-release
        shell: bash
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$BUILD_APP_COMMAND"

      - name: Notarize app and DMG, generate signed appcast, and verify release bytes
        env:
          SCRIPTS_DIR: ${{ github.workspace }}/.opl-macos-sparkle-toolchain/scripts/macos-sparkle-release
          RELEASE_TAG: ${{ inputs.release_tag }}
          APP_NAME: ${{ inputs.app_name }}
          APP_OUTPUT_PATH: ${{ inputs.app_output_path }}
          DMG_NAME: ${{ inputs.dmg_name }}
          VOLUME_NAME: ${{ inputs.volume_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          EXPECTED_TEAM_ID: ${{ inputs.expected_team_id }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          EXPECTED_FEED_URL: ${{ inputs.expected_feed_url }}
          VERIFY_BINARIES: ${{ inputs.verify_binaries }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          app_path="${APP_OUTPUT_PATH:-dist/$APP_NAME}"
          dmg_path="dist/$DMG_NAME"
          checksum_path="$dmg_path.sha256"
          appcast_path="dist/appcast.xml"
          expected_version="${RELEASE_TAG#v}"

          "$SCRIPTS_DIR/notarize-app-and-dmg.sh" \
            --app "$app_path" \
            --dmg "$dmg_path" \
            --volume-name "$VOLUME_NAME" \
            --signing-identity "$SIGNING_IDENTITY" \
            --notary-profile "$OPL_MACOS_NOTARY_PROFILE" \
            --notary-keychain "$OPL_MACOS_NOTARY_KEYCHAIN"

          "$SCRIPTS_DIR/generate-appcast.sh" \
            --dmg "$dmg_path" \
            --output "$appcast_path" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --app "$app_path" \
            --require-key-env \
            --expect-universal

          verify_args=(
            --dmg "$dmg_path"
            --checksum "$checksum_path"
            --appcast "$appcast_path"
            --app-name "$APP_NAME"
            --expected-team-id "$EXPECTED_TEAM_ID"
            --bundle-id "$BUNDLE_ID"
            --expected-version "$expected_version"
            --expected-feed-url "$EXPECTED_FEED_URL"
            --verify-binaries "$VERIFY_BINARIES"
            --require-appcast
          )
          if [[ -n "$DISPLAY_NAME" ]]; then
            verify_args+=(--display-name "$DISPLAY_NAME")
          fi
          "$SCRIPTS_DIR/verify-macos-release.sh" "${verify_args[@]}"

      - name: Upload signed and notarized macOS release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            dist/${{ inputs.dmg_name }}
            dist/${{ inputs.dmg_name }}.sha256
            dist/appcast.xml
          if-no-files-found: error

      - name: Remove temporary Apple credentials and toolchain checkout
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${OPL_MACOS_NOTARY_KEYCHAIN:-}" ]]; then
            security delete-keychain "$OPL_MACOS_NOTARY_KEYCHAIN" || true
          fi
          rm -rf .opl-macos-sparkle-toolchain
