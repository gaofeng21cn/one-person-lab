name: Daily OPL Product Channels
on:
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:
    inputs:
      product_id:
        description: Optional registered first-party product
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: opl-daily-product-channels
  cancel-in-progress: false
jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.inventory.outputs.products }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: inventory
        env:
          SELECTED_PRODUCT: ${{ inputs.product_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          products = json.loads(Path('contracts/opl-framework/product-release-owners.json').read_text())['products']
          selected = os.environ.get('SELECTED_PRODUCT', '')
          if selected:
              products = [row for row in products if row['product_id'] == selected]
              if not products:
                  raise SystemExit('Unknown product selection')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('products=' + json.dumps(products) + '\n')
          PY
  release:
    needs: inventory
    name: ${{ matrix.product.product_id }}
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.inventory.outputs.products) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller
          persist-credentials: false
      - name: Create owner release identity
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.PACKAGE_RELEASE_APP_ID }}
          private-key: ${{ secrets.PACKAGE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.product.repository_name }}
          permission-contents: write
          permission-actions: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
      - name: Checkout current product owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.product.repository }}
          ref: main
          path: owner
          fetch-depth: 0
          token: ${{ steps.publisher.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - name: Prepare or resume the owner release
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          EXPECTED_PRODUCT: ${{ matrix.product.product_id }}
          EXPECTED_REPOSITORY: ${{ matrix.product.repository }}
        run: |
          python3 controller/scripts/product-daily-release.py \
            --owner-root "$GITHUB_WORKSPACE/owner" --apply \
            --output "$RUNNER_TEMP/product-release-result.json"
      - name: Retain the independent product result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: opl-product-release-${{ matrix.product.product_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/product-release-result.json
          if-no-files-found: warn
