name: Dispatch Daily OPL Package Publications

on:
  workflow_run:
    workflows:
      - Daily OPL Package Channel
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Daily OPL Package Channel run whose plan should be dispatched.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: opl-daily-package-publication-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  dispatch-owner-publications:
    name: Dispatch independent Package owner publishers
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == github.triggering_actor &&
          (github.actor == github.repository_owner || github.actor == 'RenDeHuang'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    env:
      SOURCE_EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      MANUAL_SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
      FRAMEWORK_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Resolve completed daily detection run and candidate plan
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_run_id="$SOURCE_EVENT_RUN_ID"
          if [ -z "$source_run_id" ]; then
            source_run_id="$MANUAL_SOURCE_RUN_ID"
          fi
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/$FRAMEWORK_REPOSITORY/actions/runs/$source_run_id")"
          jq -e \
            --arg repository "$FRAMEWORK_REPOSITORY" \
            --arg run_id "$source_run_id" \
            '(.id | tostring) == $run_id and
             .repository.full_name == $repository and
             .path == ".github/workflows/daily-package-channel.yml" and
             (.event == "schedule" or .event == "workflow_dispatch") and
             .head_branch == "main" and .status == "completed" and
             .conclusion == "success" and (.head_sha | test("^[0-9a-f]{40}$"))' \
            <<< "$run_json" >/dev/null
          source_sha="$(jq -r .head_sha <<< "$run_json")"
          artifacts_json="$(gh api "repos/$FRAMEWORK_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100")"
          artifact_name="$(jq -r \
            --arg prefix "opl-daily-package-channel-candidate-" \
            --arg run_id "$source_run_id" \
            '[.artifacts[] | select(.name | startswith($prefix)) |
              select(.expired == false and (.workflow_run.id | tostring) == $run_id)] |
              if length == 1 then .[0].name else empty end' \
            <<< "$artifacts_json")"
          [[ "$artifact_name" =~ ^opl-daily-package-channel-candidate-[0-9]+$ ]]
          {
            echo "source_run_id=$source_run_id"
            echo "source_sha=$source_sha"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Download read-only daily dispatch plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.authority.outputs.artifact_name }}
          path: artifacts/daily-package-channel
          github-token: ${{ github.token }}
          run-id: ${{ steps.authority.outputs.source_run_id }}

      - name: Checkout trusted dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          clean: false
          persist-credentials: false
      - name: Create scoped owner dispatch identity
        id: publisher-token
        if: vars.PACKAGE_RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PACKAGE_RELEASE_APP_ID }}
          private-key: ${{ secrets.PACKAGE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-contents: read
      - name: Dispatch only ready owner publishers
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token || github.token }}
          SOURCE_RUN_ID: ${{ steps.authority.outputs.source_run_id }}
        run: |
          set -euo pipefail
          python3 scripts/package-publication-dispatch.py \
            --plan artifacts/daily-package-channel/package-publication-dispatch-plan.json \
            --source-run-id "$SOURCE_RUN_ID" \
            --output artifacts/daily-package-channel/dispatch-result.json
      - name: Upload dispatch results including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-package-dispatch-result-${{ github.run_id }}
          path: artifacts/daily-package-channel/dispatch-result.json
          if-no-files-found: ignore
