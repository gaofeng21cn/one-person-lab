name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  source:
    name: Source validation (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify shared release-note writer
        run: node --test tests/release-note-writer.test.mjs

      - name: Verify Linux native worker discovery
        run: node --experimental-strip-types --test tests/src/family-runtime-worker-process.test.ts

      - name: Validate source
        run: |
          npm run build
          npm run typecheck
          npm run lint
          npm test

      - name: Verify fast-lane coverage and repository hygiene
        if: matrix.node == '26'
        run: npm run test:fast -- --phase quality

  fast-lane:
    name: Framework fast lane (${{ matrix.label }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: unit-1, phase: unit, shard: '1/3' }
          - { label: unit-2, phase: unit, shard: '2/3' }
          - { label: unit-3, phase: unit, shard: '3/3' }
          - { label: cli, phase: cli, shard: '' }
          - { label: temporal, phase: temporal, shard: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The lane asserts that plugin descriptors point at reachable Git
          # bytes, which needs the real history rather than a depth-1 clone.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Source validation above stays a fast smoke gate; this job is the PR-layer
      # owner of the batched source lanes so regressions cannot accumulate between
      # weekly Verify runs. npm ci prepares each runner's local build once;
      # source validation owns quality checks. Every fast test runs in one job.
      - name: Run the fast lane
        run: |
          args=(--phase "${{ matrix.phase }}")
          if [[ -n "${{ matrix.shard }}" ]]; then args+=(--shard "${{ matrix.shard }}"); fi
          npm run test:fast -- "${args[@]}"
