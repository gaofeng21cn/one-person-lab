name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  source:
    name: Source validation (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify shared release-note writer
        run: node --test tests/release-note-writer.test.mjs

      - name: Verify shared macOS Sparkle release workflow and scripts
        run: node --test tests/macos-sparkle-release.test.mjs

      - name: Verify the Full build Flow capability compiler
        run: node --test tests/flow-capability-compiler.test.mjs

      - name: Verify Framework dependency release resolver
        run: node --experimental-strip-types --test tests/dependency-release-resolution.test.ts

      - name: Validate v2 source, guards, and contracts
        run: |
          npm run v2:build
          npm run v2:typecheck
          npm run v2:guard
          npm run lint
          ./scripts/repo-hygiene.sh
          node --experimental-strip-types ./scripts/generate-v2-contracts.mjs --check

      - name: Run v2 unit & extension tests
        run: |
          npm run v2:test
          node --test extensions/foundry/tests/*.test.mjs
          for f in extensions/foundation-skills/skills/*/kernel.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 -B "$f"
          done
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=sdks/python-client/src python3 -B -m unittest discover -s sdks/python-client/tests -v
          PYTHONDONTWRITEBYTECODE=1 node sdks/python-client/tests/test_opld_e2e.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest tests/product_release_test.py tests/package_daily_status_test.py -v

      - name: Run E2E harness self-tests & built CLI tests
        run: |
          node --test tests/built/cli.test.mjs
          node --test tests/e2e/harness.self.test.mjs tests/e2e/stubs/stubs.self.test.mjs

  fast-lane:
    name: Framework fast lane (${{ matrix.label }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: unit, phase: unit, shard: '' }
          - { label: extensions, phase: extensions, shard: '' }
          - { label: quality, phase: quality, shard: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the fast lane
        run: |
          args=(--phase "${{ matrix.phase }}")
          if [[ -n "${{ matrix.shard }}" ]]; then args+=(--shard "${{ matrix.shard }}"); fi
          npm run test:fast -- "${args[@]}"
