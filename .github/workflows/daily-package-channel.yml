name: Daily OPL Package Channel

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      package_id:
        description: Optional registered Package to prepare and publish
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: opl-daily-package-channel-${{ github.repository_owner }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect-package-channel-change:
    name: Prepare owner versions and detect independent channels
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout OPL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run build:packages
      - name: Create scoped publication identity
        id: publisher-token
        if: vars.PACKAGE_RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PACKAGE_RELEASE_APP_ID }}
          private-key: ${{ secrets.PACKAGE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-actions: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
      - name: Prepare changed owner versions
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token || github.token }}
          SELECTED_PACKAGE: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          gh repo clone gaofeng21cn/opl-flow "$RUNNER_TEMP/opl-flow" -- --depth=1 --quiet
          args=()
          if [ -n "$SELECTED_PACKAGE" ]; then args+=(--package-id "$SELECTED_PACKAGE"); fi
          python3 scripts/package-daily-release.py \
            --flow-root "$RUNNER_TEMP/opl-flow" \
            --output "$RUNNER_TEMP/opl-package-preparation.json" \
            --apply "${args[@]}"
      - name: Synchronize private owner publisher pins
        if: steps.publisher-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          SELECTED_PACKAGE: ${{ inputs.package_id }}
        run: |
          args=()
          if [ -n "$SELECTED_PACKAGE" ]; then args+=(--package-id "$SELECTED_PACKAGE"); fi
          python3 scripts/sync-private-package-publishers.py "${args[@]}"
      - name: Compare independent Package fingerprints
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token || github.token }}
          SELECTED_PACKAGE: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$SELECTED_PACKAGE" ]; then args+=(--package-id "$SELECTED_PACKAGE"); fi
          python3 scripts/package-channel-detection.py \
            --output-root dist/opl-daily-packages \
            --preparation "$RUNNER_TEMP/opl-package-preparation.json" "${args[@]}"
          cp "$RUNNER_TEMP/opl-package-preparation.json" dist/opl-daily-packages/owner-preparation.json
      - name: Upload daily package-channel candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-daily-package-channel-candidate-${{ github.run_id }}
          path: dist/opl-daily-packages
          if-no-files-found: error
