name: Daily OPL Package Channel
run-name: >-
  ${{ inputs.opl_release_control_run_id != ''
    && format('Daily OPL Package Channel [opl-release:{0}]', inputs.opl_release_control_run_id)
    || 'Daily OPL Package Channel' }}

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      package_id:
        description: Optional registered Package to prepare and publish
        required: false
        default: ''
        type: string
      opl_release_control_run_id:
        description: First-attempt schedule run ID from gaofeng21cn/opl-release
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  # GitHub replaces pending runs in a concurrency group even when its job is skipped.
  group: >-
    ${{ github.event_name == 'schedule' && vars.OPL_RELEASE_CENTRAL_DAILY == 'true'
      && format('opl-daily-package-channel-disabled-{0}', github.run_id)
      || format('opl-daily-package-channel-{0}', github.repository_owner) }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect-package-channel-change:
    name: Prepare owner versions and detect independent channels
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.OPL_RELEASE_CENTRAL_DAILY != 'true')
    concurrency:
      group: opl-daily-main-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Package release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject single-package override on centralized daily dispatch
        if: inputs.opl_release_control_run_id != ''
        env:
          SELECTED_PACKAGE: ${{ inputs.package_id }}
        run: test -z "$SELECTED_PACKAGE" || { echo "::error::Central daily dispatch covers all registered Packages without package_id override."; exit 1; }
      - name: Verify centralized daily dispatch
        if: inputs.opl_release_control_run_id != ''
        uses: gaofeng21cn/opl-release/.github/actions/verify-dispatch@v1
        with:
          control_run_id: ${{ inputs.opl_release_control_run_id }}
          workflow: daily-package-channel.yml
          expected_title: ${{ format('Daily OPL Package Channel [opl-release:{0}]', inputs.opl_release_control_run_id) }}
          gh_token: ${{ github.token }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install Framework v2 publisher dependencies
        run: npm ci --ignore-scripts
      - name: Create scoped publication identity
        id: publisher-token
        if: vars.PACKAGE_RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PACKAGE_RELEASE_APP_ID }}
          private-key: ${{ secrets.PACKAGE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-actions: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
      - name: Prepare changed owner versions
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token || github.token }}
          PACKAGE_RELEASE_APP_ID: ${{ vars.PACKAGE_RELEASE_APP_ID }}
          PACKAGE_RELEASE_APP_PRIVATE_KEY: ${{ secrets.PACKAGE_RELEASE_APP_PRIVATE_KEY }}
          PACKAGE_RELEASE_APP_OWNER: ${{ github.repository_owner }}
          SELECTED_PACKAGE: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          gh repo clone gaofeng21cn/opl-catalog "$RUNNER_TEMP/opl-catalog" -- --depth=1 --quiet
          args=()
          if [ -n "$SELECTED_PACKAGE" ]; then args+=(--package-id "$SELECTED_PACKAGE"); fi
          python3 scripts/package-daily-release.py \
            --framework-root "$GITHUB_WORKSPACE" \
            --catalog-root "$RUNNER_TEMP/opl-catalog" \
            --output "$RUNNER_TEMP/opl-package-preparation.json" \
            --apply "${args[@]}"
      - name: Refresh scoped publication identity for downstream steps
        id: sync-publisher-token
        if: vars.PACKAGE_RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PACKAGE_RELEASE_APP_ID }}
          private-key: ${{ secrets.PACKAGE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-workflows: write
      - name: Synchronize private owner publisher pins
        if: steps.sync-publisher-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.sync-publisher-token.outputs.token }}
          SELECTED_PACKAGE: ${{ inputs.package_id }}
        run: |
          args=()
          if [ -n "$SELECTED_PACKAGE" ]; then args+=(--package-id "$SELECTED_PACKAGE"); fi
          python3 scripts/sync-private-package-publishers.py \
            --framework-root "$GITHUB_WORKSPACE" \
            --controller-source-commit "$GITHUB_SHA" \
            --catalog-root "$RUNNER_TEMP/opl-catalog" \
            --preparation "$RUNNER_TEMP/opl-package-preparation.json" "${args[@]}"
      - name: Compare independent Package fingerprints
        env:
          GH_TOKEN: ${{ steps.sync-publisher-token.outputs.token || github.token }}
          SELECTED_PACKAGE: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$SELECTED_PACKAGE" ]; then args+=(--package-id "$SELECTED_PACKAGE"); fi
          python3 scripts/package-channel-detection.py \
            --framework-root "$GITHUB_WORKSPACE" \
            --controller-source-commit "$GITHUB_SHA" \
            --catalog-root "$RUNNER_TEMP/opl-catalog" \
            --output-root dist/opl-daily-packages \
            --preparation "$RUNNER_TEMP/opl-package-preparation.json" "${args[@]}"
          cp "$RUNNER_TEMP/opl-package-preparation.json" dist/opl-daily-packages/owner-preparation.json
      - name: Upload daily package-channel candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-daily-package-channel-candidate-${{ github.run_id }}
          path: dist/opl-daily-packages
          if-no-files-found: error
      - name: Checkout opl-release receipt emitter
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-release
          ref: v1
          path: .opl-release
          persist-credentials: false
      - name: Emit package lane release receipt
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: .opl-release/src
          PYTHONDONTWRITEBYTECODE: '1'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          plan_path = Path('dist/opl-daily-packages/package-publication-dispatch-plan.json')
          blocked_items = []
          if plan_path.is_file():
              plan = json.loads(plan_path.read_text())
              blocked_items = plan.get('blocked_packages') or []
          stage = 'verified' if os.environ['JOB_STATUS'] == 'success' and not blocked_items else 'blocked'
          args = [
              'python3', '-B', '-m', 'opl_release', 'emit-receipt',
              '--subject-id', 'opl-framework',
              '--lane', 'package',
              '--stage', stage,
              '--commit', os.environ['COMMIT_SHA'],
              '--run-url', os.environ['RUN_URL'],
              '--output', f"{os.environ['RUNNER_TEMP']}/release-receipt.json",
          ]
          if stage == 'blocked':
              code = 'package_lane_blocked' if blocked_items else 'daily_package_scan_failed'
              msg = '; '.join(f"{b['package_id']}: {b['reason']}" for b in blocked_items[:5]) if blocked_items else 'daily-package-channel failed'
              args.extend(['--blocker-code', code, '--blocker-message', msg[:500]])
          subprocess.run(args, check=True)
          PY
      - name: Upload package lane release receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-release-receipt-opl-framework-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-receipt.json
          overwrite: true
          if-no-files-found: error
