name: Reusable Whitepaper Build

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      output_name:
        required: true
        type: string
      publish:
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout whitepaper owner repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - name: Checkout the canonical OPL whitepaper toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          ref: main
          path: toolchain

      - name: Install document render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-chinese fonts-noto-cjk poppler-utils

      - name: Build the immutable whitepaper bundle
        run: |
          node --experimental-strip-types toolchain/scripts/run-domain-whitepaper.ts \
            --repo-root source \
            --profile "${{ inputs.profile }}"

      - name: Stage bundle and visual evidence
        run: |
          mkdir -p artifact/whitepapers artifact/evidence
          cp "source/docs/site/latest/whitepapers/${{ inputs.output_name }}.html" artifact/whitepapers/
          cp "source/docs/site/latest/whitepapers/${{ inputs.output_name }}.pdf" artifact/whitepapers/
          cp "source/docs/site/latest/whitepapers/${{ inputs.output_name }}.verification.json" artifact/whitepapers/
          if [ -f source/docs/site/latest/whitepapers/index.html ]; then
            cp source/docs/site/latest/whitepapers/index.html artifact/whitepapers/
          fi
          cp -R "source/tmp/pdfs/${{ inputs.output_name }}/rendered" artifact/evidence/rendered-pages

      - name: Upload approved-byte candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whitepaper-${{ inputs.output_name }}-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 30
