<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OPL Apps</title>
    <style>/* STYLE */</style>
  </head>
  <body>
    <div id="root" class="shell" data-opl-family="opl-apps">
      <nav id="app-navigation" class="app-navigation" aria-label="产品与功能">
        <span class="brand" title="OPL Apps"><span class="mark" aria-hidden="true"></span><span class="sr-only">OPL Apps</span></span>
        <label id="product-picker" class="product-picker" for="product-select"><span>产品</span><select id="product-select" class="dsh-input"></select></label>
        <span id="runtime-context" class="runtime-context" hidden>当前任务</span>
        <label id="view-picker" class="compact-navigation" for="view-select"><span>功能</span><select id="view-select" aria-label="当前功能" class="dsh-input"></select></label>
        <span id="status" class="connection-status">正在连接</span>
        <details id="catalog-search" class="catalog-search">
          <summary class="dsh-button">查找</summary>
          <div class="search-panel">
            <label class="search"><span>查找产品或功能</span><input id="search" type="search" placeholder="搜索所有产品与功能" class="dsh-input"></label>
            <div class="catalog-heading"><span id="views-label">应用功能</span><small id="view-count"></small></div>
            <div id="views" aria-label="搜索结果"></div>
          </div>
        </details>
        <span id="product-count" hidden></span><p id="product-summary" hidden></p>
      </nav>
      <main class="content">
        <header id="view-toolbar" class="toolbar">
          <div>
            <h1 id="title">正在读取应用</h1>
            <p id="subtitle" class="subtitle"></p>
          </div>
          <div id="toolbar-actions" class="toolbar-actions">
            <button id="dedicated" class="dsh-button action" type="button" hidden>打开专用界面</button>
            <button id="refresh" type="button" class="dsh-button">刷新</button>
            <button id="fullscreen" type="button" class="dsh-button">展开</button>
          </div>
        </header>
        <div id="notice" class="notice" role="status" hidden></div>
        <section id="body" class="body" aria-live="polite">
          <div class="empty">正在载入应用内容…</div>
        </section>
      </main>
    </div>
    <dialog id="confirmation" aria-labelledby="confirmation-title">
      <div>
        <h2 id="confirmation-title"></h2>
        <p>请核对本次操作的目标与输入。</p>
        <div id="confirmation-target"></div>
        <div class="detail-actions">
          <button id="confirmation-cancel" type="button" class="dsh-button">取消</button>
          <button id="confirmation-submit" class="dsh-button action" type="button">确认执行</button>
        </div>
      </div>
    </dialog>
    <script type="module">/* SCRIPT */</script>
  </body>
</html>
