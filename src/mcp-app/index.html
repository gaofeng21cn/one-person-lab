<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OPL Apps</title>
    <style>/* STYLE */</style>
  </head>
  <body>
    <div id="root" class="shell" data-opl-family="opl-apps">
      <aside class="sidebar">
        <header class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <strong>OPL Apps</strong>
            <span id="status">正在连接</span>
          </div>
        </header>
        <label class="search">
          <span>查找</span>
          <input id="search" type="search" placeholder="搜索应用或功能">
        </label>
        <label class="product-picker" for="product-select"><span>选择应用 <small id="product-count"></small></span>
          <select id="product-select"></select>
        </label>
        <p id="product-summary" class="product-summary"></p>
        <label class="compact-navigation" for="view-select">当前功能
          <select id="view-select"></select>
        </label>
        <div class="catalog-heading views-heading">
          <span id="views-label">应用功能</span>
          <small id="view-count"></small>
        </div>
        <nav id="views" aria-label="应用功能"></nav>
      </aside>
      <main class="content">
        <header class="toolbar">
          <div>
            <h1 id="title">正在读取应用</h1>
            <p id="subtitle" class="subtitle"></p>
          </div>
          <div class="toolbar-actions">
            <button id="refresh" type="button">刷新</button>
            <button id="fullscreen" type="button">展开</button>
          </div>
        </header>
        <div id="notice" class="notice" role="status" hidden></div>
        <section id="body" class="body" aria-live="polite">
          <div class="empty">正在载入应用内容…</div>
        </section>
      </main>
    </div>
    <dialog id="confirmation" aria-labelledby="confirmation-title">
      <div>
        <h2 id="confirmation-title"></h2>
        <p>请核对本次操作的目标与输入。</p>
        <div id="confirmation-target"></div>
        <div class="detail-actions">
          <button id="confirmation-cancel" type="button">取消</button>
          <button id="confirmation-submit" class="action" type="button">确认执行</button>
        </div>
      </div>
    </dialog>
    <script type="module">/* SCRIPT */</script>
  </body>
</html>
