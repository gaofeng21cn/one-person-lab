[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opl-client"
version = "2.0.0"
description = "Thin pure-stdlib Python JSON-RPC 2.0 client SDK for OPL Framework v2 (opld)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
